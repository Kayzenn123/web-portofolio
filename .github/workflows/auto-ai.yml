name: Autonomous AI Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  ai-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install axios fs

      - name: Generate AI Improvements
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > ai.js << 'EOF'
          const axios = require("axios");
          const fs = require("fs");

          async function runAI() {
            let html = "";

            try {
              html = fs.readFileSync("index.html", "utf8");
            } catch {
              html = "<html><body><h1>Empty Project</h1></body></html>";
            }

            const prompt = `
            Improve this HTML landing page into a premium futuristic modern SaaS UI.
            Add better UI/UX, sections, gradients, animations, premium layout, modern typography, and cinematic feel.

            Return ONLY raw HTML code.

            CURRENT HTML:
            ${html}
            `;

            const response = await axios.post(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + process.env.GEMINI_API_KEY,
              {
                contents: [
                  {
                    parts: [{ text: prompt }]
                  }
                ]
              }
            );

            const text =
              response.data.candidates[0].content.parts[0].text;

            fs.writeFileSync("index.html", text);

            console.log("AI website updated.");
          }

          runAI();
          EOF

          node ai.js

      - name: Commit Changes
        run: |
          git config --global user.name "AI Worker"
          git config --global user.email "ai@worker.com"
          git add .
          git commit -m "AI autonomous redesign" || echo "No changes"

      - name: Push Changes
        run: git push
