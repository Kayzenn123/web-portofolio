name: Autonomous AI Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  ai-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Axios
        run: npm install axios

      - name: Run AI
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |

          cat > ai.js << 'EOF'
          const axios = require("axios");
          const fs = require("fs");

          async function main() {
            try {

              let html = "";

              try {
                html = fs.readFileSync("index.html", "utf8");
              } catch {
                html = "<html><body><h1>Starter</h1></body></html>";
              }

              const prompt = `
              Improve this website into a futuristic premium SaaS landing page.
              Make it modern, cinematic, animated, luxury UI/UX, responsive.
              Return ONLY raw HTML.
              CURRENT CODE:
              ${html}
              `;

              const response = await axios.post(
                "https://openrouter.ai/api/v1/chat/completions",
                {
                  model: "mistralai/mistral-7b-instruct:free"
                  messages: [
                    { role: "user", content: prompt }
                  ]
                },
                {
                  headers: {
                    "Authorization": "Bearer " + process.env.OPENROUTER_API_KEY,
                    "Content-Type": "application/json"
                  }
                }
              );

              const result =
                response.data.choices[0].message.content;

              fs.writeFileSync("index.html", result);

              console.log("AI update success");

            } catch (err) {
              console.error(err.response?.data || err.message);
              process.exit(1);
            }
          }

          main();
          EOF

          node ai.js

      - name: Commit Changes
        run: |
          git config --global user.name "AI Worker"
          git config --global user.email "ai@worker.com"
          git add .
          git commit -m "AI autonomous update" || echo "No changes"

      - name: Push Changes
        run: git push
