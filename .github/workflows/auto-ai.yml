name: AI Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install axios

      - name: Run AI
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node ai.js

      - name: Commit
        run: |
          git config user.name "AI"
          git config user.email "ai@ai.com"
          git add .
          git commit -m "AI update" || echo "no changes"
          git push
