name: Autonomous AI Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Axios
        run: npm install axios

      - name: Run AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          cat > ai.js << 'EOF'
          const axios = require("axios");
          const fs = require("fs");

          async function main() {
            try {

              let currentHTML = "";

              try {
                currentHTML = fs.readFileSync("index.html", "utf8");
              } catch {
                currentHTML = "<html><body><h1>Starter</h1></body></html>";
              }

              const prompt = `
              Create a premium futuristic landing page.
              Return ONLY valid HTML.
              `;

              const response = await axios.post(
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + process.env.GEMINI_API_KEY,
                {
                  contents: [
                    {
                      parts: [
                        { text: prompt }
                      ]
                    }
                  ]
                }
              );

              console.log(JSON.stringify(response.data, null, 2));

              const text =
                response.data.candidates?.[0]?.content?.parts?.[0]?.text;

              if (!text) {
                throw new Error("No AI response");
              }

              fs.writeFileSync("index.html", text);

              console.log("Website updated.");

            } catch (err) {
              console.error(err.response?.data || err.message);
              process.exit(1);
            }
          }

          main();
          EOF

          node ai.js

      - name: Commit Changes
        run: |
          git config --global user.name "AI Worker"
          git config --global user.email "ai@worker.com"
          git add .
          git commit -m "AI generated website" || echo "No changes"

      - name: Push Changes
        run: git push
