<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Absensi Web</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #0b0f17;
            --bg-surface: #111827;
            --bg-card: #151c2c;
            --bg-input: rgba(255, 255, 255, 0.05);
            --bg-input-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --primary: #00d4ff;
            --primary-hover: #00b8e6;
            --primary-glow: rgba(0, 212, 255, 0.25);
            --accent-start: #7c3aed;
            --accent-end: #06b6d4;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(0, 212, 255, 0.5);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.35);
            --shadow-glow: 0 0 24px rgba(0, 212, 255, 0.15);
            --transition: 0.25s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        header {
            width: 100%;
            padding: 24px 20px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(124, 58, 237, 0.06));
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--accent-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .form-container {
            background: var(--bg-card);
            padding: 32px 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 560px;
            border: 1px solid var(--border);
            margin: 24px 0;
        }

        h2 {
            margin: 0 0 24px;
            font-size: 1.35rem;
            font-weight: 600;
            text-align: center;
            color: var(--primary);
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"] {
            margin: 0;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            width: 100%;
            transition: all var(--transition);
            background-color: var(--bg-input);
            color: var(--text-primary);
            line-height: 1.5;
        }

        input[type="text"]::placeholder,
        input[type="date"]::placeholder,
        input[type="time"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:hover,
        input[type="date"]:hover,
        input[type="time"]:hover {
            background-color: var(--bg-input-hover);
            border-color: rgba(255, 255, 255, 0.12);
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="time"]:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: var(--shadow-glow);
            background-color: rgba(255, 255, 255, 0.06);
        }

        button[type="submit"] {
            margin: 0;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            width: 100%;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), #0099cc);
            color: #fff;
            box-shadow: 0 2px 12px var(--primary-glow);
            transition: all var(--transition);
            letter-spacing: 0.01em;
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, var(--primary-hover), #0088b3);
            box-shadow: 0 4px 20px var(--primary-glow);
            transform: scale(1.01);
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        footer {
            margin-top: 24px;
            padding: 16px 20px;
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-muted);
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px 16px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .form-container {
                padding: 24px 16px;
                margin: 16px 0;
            }

            h2 {
                font-size: 1.2rem;
                margin-bottom: 20px;
            }

            input[type="text"],
            input[type="date"],
            input[type="time"] {
                padding: 12px 14px;
                font-size: 0.9rem;
            }

            button[type="submit"] {
                padding: 12px 20px;
                font-size: 0.9rem;
            }

            footer {
                margin-top: 16px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Absensi Web</h1>
    </header>
    <div class="form-container">
        <h2>Isi Data Absen</h2>
        <form>
            <input type="text" placeholder="Nama Lengkap" required>
            <input type="date" required>
            <input type="time" required>
            <button type="submit">Kirim Absen</button>
        </form>
    </div>
    <footer>
        <p>&copy; 2023 Sistem Absensi. Semua hak dilindungi.</p>
    </footer>
</body>
</html>
