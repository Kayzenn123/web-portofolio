<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Web</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0A0A0A;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background: linear-gradient(90deg, rgba(255, 0, 150, 0.1), rgba(0, 212, 255, 0.1));
            width: 100%;
            padding: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .form-container {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
        }
        input[type="text"], input[type="date"], input[type="time"], button {
            margin: 10px 0;
            padding: 10px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            width: 100%;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, input[type="date"]:focus, input[type="time"]:focus {
            outline: none;
            border: 2px solid #00D2FF;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        button {
            background-color: #00D2FF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #00BFFF;
        }
        footer {
            margin-top: 20px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Absensi Web</h1>
    </header>
    <div class="form-container">
        <h2>Isi Data Absen</h2>
        <form>
            <input type="text" placeholder="Nama Lengkap" required>
            <input type="date" required>
            <input type="time" required>
            <button type="submit">Kirim Absen</button>
        </form>
    </div>
    <footer>
        <p>&copy; 2023 Sistem Absensi. Semua hak dilindungi.</p>
    </footer>
</body>
</html>
