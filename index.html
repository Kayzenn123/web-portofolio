<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Absensi Web</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1A1A1A;
            color: #EAEAEA;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background: linear-gradient(90deg, rgba(255, 0, 150, 0.15), rgba(0, 212, 255, 0.15));
            width: 100%;
            padding: 30px 20px;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 3em;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 40px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(10px);
        }

        h2 {
            margin: 0 0 20px;
            font-size: 2em;
            text-align: center;
            color: #00D2FF;
        }

        input[type="text"], input[type="date"], input[type="time"], button {
            margin: 10px 0;
            padding: 15px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            width: 100%;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder, input[type="date"]::placeholder, input[type="time"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input[type="text"]:focus, input[type="date"]:focus, input[type="time"]:focus {
            outline: none;
            border: 2px solid #00D2FF;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        button {
            background-color: #00D2FF;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
        }

        button:hover {
            background-color: #00BFFF;
            box-shadow: 0 4px 30px rgba(0, 190, 255, 0.5);
            transform: scale(1.02);
        }

        footer {
            margin-top: 30px;
            font-size: 0.9em;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5em;
            }

            h2 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Absensi Web</h1>
    </header>
    <div class="form-container">
        <h2>Isi Data Absen</h2>
        <form>
            <input type="text" placeholder="Nama Lengkap" required>
            <input type="date" required>
            <input type="time" required>
            <button type="submit">Kirim Absen</button>
        </form>
    </div>
    <footer>
        <p>&copy; 2023 Sistem Absensi. Semua hak dilindungi.</p>
    </footer>
</body>
</html>
